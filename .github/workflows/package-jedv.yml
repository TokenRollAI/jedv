name: Package Jedv

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize the macOS package with Jedv Apple credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-macos-arm64:
    name: Package macOS arm64 (${{ inputs.signed && 'signed' || 'unsigned' }})
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Setup Node.js for native modules
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Check release versions
        run: bun run check:versions

      - name: Set up signing keychain
        if: inputs.signed
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            test -n "${!required}" || { echo "::error::Missing release secret: $required"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/jedv-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/jedv-certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          trap 'rm -f "$CERT_PATH"' EXIT
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          KEYCHAINS=()
          while IFS= read -r path; do
            KEYCHAINS+=("$path")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN" > "$RUNNER_TEMP/jedv-signing-identities.txt"
          grep -q "Developer ID Application" "$RUNNER_TEMP/jedv-signing-identities.txt"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build signed macOS packages
        if: inputs.signed
        working-directory: apps/desktop
        env:
          TARGET_ARCH: arm64
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bun run generate:icons
          bun run compile:app
          bun run package -- --arm64 --config.forceCodeSigning=true

      - name: Build unsigned macOS packages
        if: ${{ !inputs.signed }}
        working-directory: apps/desktop
        env:
          TARGET_ARCH: arm64
        run: bun run build -- --arm64

      - name: Verify macOS packages
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d -print -quit)
          test -n "$APP_DIR"
          test -f "$APP_DIR/Contents/Resources/app-update.yml"
          CLI_BIN="$APP_DIR/Contents/Resources/resources/bin/jedv"
          test -x "$CLI_BIN"
          "$CLI_BIN" --version
          compgen -G "release/*.dmg" > /dev/null
          compgen -G "release/*.zip" > /dev/null
          compgen -G "release/*-mac.yml" > /dev/null

      - name: Verify signing and notarization
        if: inputs.signed
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d -print -quit)
          codesign --verify --deep --strict "$APP_DIR"
          codesign --display --verbose=2 "$APP_DIR" 2>&1 | grep -E '^TeamIdentifier=[A-Za-z0-9]{10}$'
          xcrun stapler validate "$APP_DIR"
          spctl --assess --type execute --verbose "$APP_DIR"

      - name: Delete signing keychain
        if: ${{ always() && inputs.signed }}
        run: security delete-keychain "$RUNNER_TEMP/jedv-signing.keychain-db" || true

      - name: Gate macOS update manifest on minimum system version
        working-directory: apps/desktop
        run: bun scripts/gate-mac-update-manifest.ts release

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: jedv-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/*-mac.yml
          retention-days: 30
          if-no-files-found: error

  package-linux-x64:
    name: Package Linux x64 (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Setup Node.js for native modules
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Check release versions
        run: bun run check:versions

      - name: Build unsigned Linux packages (--publish never via build script)
        working-directory: apps/desktop
        env:
          TARGET_ARCH: x64
        run: bun run build

      - name: Verify Linux packages
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          compgen -G "release/*.AppImage" > /dev/null
          compgen -G "release/*.deb" > /dev/null
          compgen -G "release/*-linux.yml" > /dev/null
          CLI_BIN=$(find release -path "*/resources/resources/bin/jedv" -type f -perm -111 -print -quit)
          test -n "$CLI_BIN"
          "$CLI_BIN" --version

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: jedv-linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*-linux.yml
          retention-days: 30
          if-no-files-found: error
