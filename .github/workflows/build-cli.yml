name: Build CLI

# Reusable local build workflow. CI passes a JSON matrix to select targets.

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of {os, target} build matrix entries'
        required: true
        type: string
      upload:
        description: 'Upload built tarballs as artifacts'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Setup Node.js (for native addon compilation)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies (Linux — skip scripts, rebuild manually)
        if: startsWith(matrix.target, 'linux-')
        run: |
          # Bun's install-script runner has a cache materialization race
          # against node-pty's compile-from-source path on Linux (node-pty
          # ships no Linux prebuilds). Skip scripts at install, then rebuild
          # native deps explicitly via npm/node-gyp.
          #
          # better-sqlite3 is intentionally NOT rebuilt here: build-dist.ts's
          # fixNativeBinariesForNode() unconditionally downloads the matching
          # Node-ABI prebuild from GitHub releases and overwrites the .node
          # file. Running `npm rebuild better-sqlite3` here is redundant work
          # and a CI flake source — its `prebuild-install || node-gyp rebuild`
          # install script intermittently truncates the prebuild download or
          # leaves partial state that breaks the gyp fallback on linux-x64.
          set -euo pipefail
          bun install --frozen --ignore-scripts
          PTY_DIR=$(ls -d node_modules/.bun/node-pty@*/node_modules/node-pty)
          (cd "$PTY_DIR" && npx --yes node-gyp rebuild)
          npm rebuild @parcel/watcher

      - name: Install dependencies (macOS)
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun install --frozen --ignore-scripts; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Build distribution
        working-directory: packages/cli
        run: bun run build:dist --target=${{ matrix.target }}

      - name: Run isolated local smoke test
        run: |
          DIST="$(pwd)/packages/cli/dist/jedv-${{ matrix.target }}"
          bash packages/cli/scripts/smoke-test.sh "$DIST" "${{ matrix.target }}"

      - name: Check distribution contents
        run: |
          set -euo pipefail
          DIST="$(pwd)/packages/cli/dist/jedv-${{ matrix.target }}"
          tar -tzf "$DIST.tar.gz" > "$RUNNER_TEMP/cli-dist-contents.txt"
          grep -Fx './lib/agent-templates/notify-hook.template.sh' "$RUNNER_TEMP/cli-dist-contents.txt"
          if grep -q '^./lib/agent-templates/plugin/' "$RUNNER_TEMP/cli-dist-contents.txt"; then
            echo "::error::Retired default plugin found in CLI distribution"
            exit 1
          fi

      - name: Upload tarball
        if: inputs.upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: jedv-${{ matrix.target }}
          path: packages/cli/dist/jedv-${{ matrix.target }}.tar.gz
          if-no-files-found: error
